<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>酒吧接酒杯</title>
  <link rel="stylesheet" href="Assets/styles.css?v=20260712-initial-hud-blur1">
</head>
<body>
  <main class="game-shell">
    <section class="game-stage" aria-label="酒吧接酒杯小遊戲">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <div id="loadingOverlay" class="loading-overlay is-black" aria-label="Loading">
        <div class="loading-cover">
          <img src="Assets/LoadingPage1.png" alt="">
        </div>
        <div class="loading-tap">Tap to continue</div>
      </div>

      <div class="hud top-hud" aria-live="polite">
        <div class="hud-block">
          <span class="hud-label">分數</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="hud-block">
          <span class="hud-label">連擊</span>
          <strong id="comboValue">0</strong>
        </div>
        <div class="hud-block">
          <span class="hud-label">Total</span>
          <strong id="catchValue">0</strong>
        </div>
        <div class="hud-block">
          <span class="hud-label">生命</span>
          <strong id="lifeValue" class="life-hearts" aria-label="生命 3"></strong>
        </div>
        <div class="hud-block">
          <span class="hud-label">時間</span>
          <strong id="timeValue">60</strong>
        </div>
      </div>

      <div id="messagePanel" class="message-panel is-info is-hidden">
        <div id="infoSlider" class="info-slider" aria-label="遊戲說明">
          <button id="infoPrevButton" class="info-arrow info-arrow-left" type="button" aria-label="上一頁"></button>
          <div id="infoPageFrame" class="info-page-frame">
            <img id="infoCurrentImage" class="info-page info-page-current" src="Assets/Info_Page1.png" alt="">
            <img id="infoNextImage" class="info-page info-page-next" src="Assets/Info_Page2.png" alt="">
          </div>
          <button id="infoNextButton" class="info-arrow info-arrow-right" type="button" aria-label="下一頁"></button>
        </div>
        <h1></h1>
        <p></p>
        <button id="startButton" type="button">開始</button>
      </div>

      <div class="controls" aria-label="操作按鈕">
        <button id="leftButton" type="button" aria-label="向左">
          <img src="Assets/Left_Arr.png" alt="">
        </button>
        <button id="pauseButton" type="button" aria-label="暫停">暫停</button>
        <button id="bgmButton" type="button" aria-label="切換背景音樂">BGM OFF</button>
        <button id="rightButton" type="button" aria-label="向右">
          <img src="Assets/Right_Arr.png" alt="">
        </button>
      </div>

      <div class="debug-panel">
        <button id="debugToggleButton" class="debug-toggle" type="button">Debug</button>
        <div id="debugOptions" class="debug-options" hidden>
          <label>
            <input id="debugTrayCollision" type="checkbox">
            托盤 Collision
          </label>
          <label>
            <input id="debugCatCollision" type="checkbox">
            貓 Collision
          </label>
          <label>
            <input id="debugBottleCollision" type="checkbox">
            酒瓶 Collision
          </label>
          <label>
            <input id="debugJukeboxCollision" type="checkbox">
            點唱機 Collision
          </label>
          <label>
            <input id="debugInfiniteMode" type="checkbox">
            無限模式
          </label>
          <label>
            <input id="debugInputArea" type="checkbox">
            輸入區 / 中線
          </label>
          <div class="debug-number-row">
            <span>reverseSwitchDistance</span>
            <input id="debugReverseDistance" type="number" min="0" step="1" value="22">
            <button id="debugReverseDistanceApply" type="button">OK</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="Source/app.js?v=20260712-initial-hud-blur1"></script>
</body>
</html>
